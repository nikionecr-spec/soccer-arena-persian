# Soccer Arena Persian — Nginx reverse proxy (inside the nginx container)
# BEFORE the first certificate exists: keep only the HTTP block; after certbot
# issued the cert, uncomment the TLS block (docs/INSTALL.md step 6).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment AFTER the certificate is issued:
    # location / { return 301 https://$host$request_uri; }

    location / {
        proxy_pass http://game:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

