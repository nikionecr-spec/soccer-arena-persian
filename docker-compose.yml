# Soccer Arena Persian — Docker Compose (production on your VPS)
# Usage: see docs/INSTALL.md
services:
  game:
    build: .
    container_name: sap_game
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8080
      - DB_URL=postgres://soccer:${POSTGRES_PASSWORD}@postgres:5432/soccer
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./client:/app/client:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [sapnet]

  postgres:
    image: postgres:16-alpine
    container_name: sap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: soccer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soccer
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soccer -d soccer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sapnet]

  redis:
    image: redis:7-alpine
    container_name: sap_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    networks: [sapnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: sap_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on: [game]
    networks: [sapnet]

  certbot:
    image: certbot/certbot
    container_name: sap_certbot
    # run manually for the first certificate (see docs/INSTALL.md):
    #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d YOUR_DOMAIN --agree-tos -m YOU@MAIL --no-eff-email
    # renew:
    #   docker compose run --rm certbot renew --webroot -w /var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; done"
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    networks: [sapnet]

volumes:
  pgdata:
  redisdata:

networks:
  sapnet:
    driver: bridge
